# PNX-ToolBox command messages
#
# Color codes use '&' (for example: &c red, &e yellow, &a green).
# Every placeholder shown below is replaced at runtime.
# Available placeholders:
#   {permission}, {time}, {argument}, {arguments}, {count}, {value},
#   {minimum}, {maximum}, {options}, {player}, {selector}, {coordinate},
#   {level}, {usage}
# Missing keys use the built-in defaults. An empty message disables that output.

rules:
  permission: "&cYou do not have permission to use this command. (&7{permission}&c)"
  only-player: "&cThis command can only be used in-game."
  only-console: "&cThis command can only be used from the local console."
  only-rcon: "&cThis command can only be used through RCON."
  cooldown: "&cYou must wait {time}s before using this command again."
  predicate: "&cYou cannot use this command right now."

arguments:
  missing: "&cMissing required argument(s): {arguments}"
  missing-one: "&cMissing required argument: {argument}"
  too-many: "&cToo many arguments: {arguments}"
  token-count: "&cArgument '{argument}' expects {count} token(s)."
  integer: "&cArgument '{argument}' must be an integer."
  integer-range: "&cArgument '{argument}' must be between {minimum} and {maximum}."
  long: "&cArgument '{argument}' must be a long integer."
  number: "&cArgument '{argument}' must be a number."
  number-range: "&cArgument '{argument}' must be between {minimum} and {maximum}."
  option: "&cArgument '{argument}' must be one of: {options}."
  dynamic-enum: "&cUnknown value '{value}' for argument '{argument}'."
  player-not-online: "&cPlayer '{player}' is not online."
  invalid-selector: "&cInvalid entity selector '{selector}'."
  coordinates-count: "&cArgument '{argument}' requires three coordinates."
  relative-coordinates: "&cRelative coordinates require an in-game entity sender."
  local-coordinates: "&cLocal coordinates using '^' are not supported."
  invalid-coordinate: "&cInvalid coordinate '{coordinate}'."
  coordinate-range: "&cCoordinate '{coordinate}' is outside the supported range."
  level-not-loaded: "&cLevel '{level}' is not loaded."
  uuid: "&cArgument '{argument}' must be a valid UUID."

command:
  rule-failed: "&cCommand rules were not satisfied."
  execution-error: "&cAn error occurred while executing this command."
  usage: "&eUsage: {usage}"
