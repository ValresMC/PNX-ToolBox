name: Build and publish release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        run: mvn spotless:apply --batch-mode --no-transfer-progress clean verify

      - name: Prepare the release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(
            find target -maxdepth 1 -type f \
              -name 'pnx-toolbox-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}." >&2
            printf 'Found: %s\n' "${jars[@]:-none}" >&2
            exit 1
          fi

          safe_tag="${GITHUB_REF_NAME//\//-}"
          asset_path="target/PNX-ToolBox-${safe_tag}.jar"
          cp "${jars[0]}" "$asset_path"
          echo "path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload the JAR to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PATH: ${{ steps.asset.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "$GITHUB_REPOSITORY"
